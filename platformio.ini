; SaltView - brine tank salt level monitor
; Board: Adafruit ESP32-S2 Feather (4MB flash, 2MB PSRAM)
;
;   pio run -t upload      build + flash firmware
;   pio run -t uploadfs    flash the web dashboard (data/ -> LittleFS)
;   pio device monitor     serial log

[platformio]
default_envs = feather_s2

[env:feather_s2]
platform = espressif32@^6.9.0
board = adafruit_feather_esp32s2
framework = arduino
monitor_speed = 115200

; Standard 4MB layout with a LittleFS ("spiffs") data partition.
; Replaces the board's TinyUF2 layout, so flash over USB with esptool.
board_build.partitions = default.csv
board_build.filesystem = littlefs
; The board definition flashes TinyUF2 at 0x2d0000, which is inside our
; LittleFS partition and would corrupt the reading history on every upload.
board_upload.arduino.flash_extra_images =

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit LED Backpack Library@^1.5.1
    adafruit/Adafruit BusIO@^1.16.1
    ; not in the PlatformIO registry yet
    https://github.com/adafruit/Adafruit_VCNL4200.git#1.0.1
    bblanchon/ArduinoJson@^7.2.0
